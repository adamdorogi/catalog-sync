name: ci

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: start Postgres, Redpanda, and OpenSearch
        run: |
          sudo sysctl -w vm.max_map_count=262144
          docker compose up -d --wait --wait-timeout 180
      - run: npm run db:migrate
      - run: CATALOG_INTEGRATION=1 npm run test:integration
      - run: npm run seed -- --count=100
      - name: check live search, propagation, and alias swap
        env:
          EMBEDDING_PROVIDER: local
          EMBEDDING_CACHE_DIR: ${{ runner.temp }}/catalog-model
        run: |
          node --import tsx services/api/src/main.ts &
          api_pid=$!
          node --import tsx services/worker/src/main.ts &
          worker_pid=$!
          trap 'kill "$api_pid" "$worker_pid" 2>/dev/null || true; wait' EXIT
          CATALOG_PIPELINE_INTEGRATION=1 npm run test:integration -- services/api/src/pipeline.integration.test.ts
      - name: show dependency logs
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: stop dependencies
        if: always()
        run: docker compose down --volumes
